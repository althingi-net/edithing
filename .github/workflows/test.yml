# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests and build 
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Run tests and build

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      DATABASE_NAME: edithing
      DATABASE_USER: edithing
      DATABASE_PASSWORD: secret-string

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      name: Install pnpm
      with:
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - uses: mirromutth/mysql-action@v1.1
      with:
        mysql version: '8.0'
        mysql database: 'edithing'
        mysql user: "edithing"
        mysql password: "secret-string"
        
    - run: pnpm run lint
    - run: pnpm run test
    - run: pnpm run build
    - run: pnpm run typecheck
